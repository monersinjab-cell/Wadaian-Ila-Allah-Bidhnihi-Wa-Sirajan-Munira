<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>شاشة مراقبة الترددات الراديوية للمنظومة</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #eee; padding: 20px; }
        .card { background: #222; border: 1px solid #333; padding: 20px; border-radius: 8px; max-width: 600px; margin: 0 auto; }
        h2 { color: #00ffcc; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .metric { margin: 10px 0; font-size: 1.1em; }
        .value { color: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📡 لوحة المحاكاة الفيزيائية الواقعية (RF Simulator)</h2>
        <div class="metric">التردد الناقل: <span class="value">1408.0 MHz</span></div>
        <div class="metric">المسافة الحسابية: <span class="value">500 متر</span></div>
        <div class="metric">توهين المسار (Friis): <span class="value">89.39 dB</span></div>
        <div class="metric">طاقة الاستقبال التقريبية: <span class="value">-55.09 dBm</span></div>
        <div class="metric">إزاحة دبلر المحسوبة: <span class="value">70.4 Hz</span></div>
        <div class="metric">سعة القناة القصوى (Shannon): <span class="value">391.37 Mbps</span></div>
        <div class="metric" style="color: #00ff00; margin-top: 15px;">🔒 حالة الحماية البنيوية: SECURED</div>
    </div>
</body>
</html>
